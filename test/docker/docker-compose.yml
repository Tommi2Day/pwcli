name: pwcli
services:
  ldap:
    image: "${VENDOR_IMAGE_PREFIX}docker.io/cleanstart/openldap:latest"
    restart: "no"
    hostname: "ldap.example.local"
    ports:
      - '1389:389'
      - '1636:636'
    volumes:
      - "./ldap/ldif:/ldif:ro"
      - "./ldap/certs:/certs:ro"
      - "./ldap/etc/slapd.conf:/etc/openldap/slapd.conf:ro"

  kms:
    image: "${VENDOR_IMAGE_PREFIX}docker.io/motoserver/moto:5.1.16"
    ports:
      - "18080:5000"

  awssm:
    image: "${VENDOR_IMAGE_PREFIX}docker.io/motoserver/moto:5.2.3"
    ports:
      - "18081:5000"

  vault:
    image: "${VENDOR_IMAGE_PREFIX}docker.io/hashicorp/vault:1.21.4"
    volumes:
      - ./vault_provision:/vault_provision:ro
    restart: "no"
    ports:
      - '18200:8200'
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=pwcli-test
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - PGHOST=postgresql
      - PGPORT=5432
    cap_add:
      - IPC_LOCK
    depends_on:
      - postgresql

  postgresql:
    image: "${VENDOR_IMAGE_PREFIX}docker.io/library/postgres:18.3-bookworm"
    volumes:
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    restart: "no"
    ports:
      - '15432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

